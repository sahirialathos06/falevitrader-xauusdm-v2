<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaleviTrader — XAUUSD (M5)</title>
  <style>
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #58a6ff; }
    .controls {
      margin: 15px 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    input, select, button {
      padding: 8px;
      border-radius: 6px;
      border: none;
      outline: none;
      font-size: 14px;
    }
    input, select {
      background: #161b22;
      color: #e6edf3;
    }
    button {
      background: #238636;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #2ea043; }
    canvas {
      margin-top: 20px;
      background: #161b22;
      border-radius: 10px;
      max-width: 100%;
    }
    #signalBox {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      display: inline-block;
      text-align: left;
      color: #c9d1d9;
    }
  </style>
</head>
<body>
  <h1>📊 FaleviTrader — XAUUSD (M5)</h1>
  <div class="controls">
    <input id="symbol" value="XAUUSD" style="width:120px" />
    <select id="interval">
      <option value="5min">M5</option>
    </select>
    <input id="apikey" placeholder="Masukkan Twelve Data API Key Anda" style="width:260px" />
    <button id="start">Mulai</button>
  </div>
  <div id="clock">Waktu lokal: --:--:--</div>

  <div id="signalBox">
    <strong>Sinyal Terbaru:</strong>
    <div id="signal"> XAUUSD </div>
  </div>

  <canvas id="chart" width="800" height="400"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const ctx = document.getElementById('chart').getContext('2d');
    let chart;

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        'Waktu lokal: ' + now.toLocaleTimeString('id-ID');
    }
    setInterval(updateClock, 1000);

    document.getElementById('start').addEventListener('click', async () => {
      const symbol = document.getElementById('symbol').value;
      const interval = document.getElementById('interval').value;
      const apikey = document.getElementById('apikey').value;

      if (!apikey) {
        
  const url = https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=5min&apikey=280902dce02742d8ae851f26de491a9b&outputsize=5

      try {
        const res = await fetch(url);
        const data = await res.json();

        const values = data.values.reverse();
        const labels = values.map(v => v.datetime);
        const prices = values.map(v => parseFloat(v.close));

        if (chart) chart.destroy();
        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: `${XAUUSD} (M5)`,
              data: prices,
              borderColor: '#58a6ff',
              borderWidth: 2,
              tension: 0.3,
              fill: false
            }]
          },
          options: {
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#8b949e' } },
              y: { ticks: { color: '#8b949e' } }
            }
          }
        });

        // ====== Buat prediksi sederhana (berdasarkan slope harga terakhir) ======
        const last = prices[prices.length - 1];
        const prev = prices[prices.length - 2];
        const diff = last - prev;

        let signalText, tp, sl;
        if (diff > 0) {
          signalText = '📈 Entry BUY';
          tp = (last + 0.30).toFixed(2);
          sl = (last - 0.20).toFixed(2);
        } else {
          signalText = '📉 Entry SELL';
          tp = (last - 0.30).toFixed(2);
          sl = (last + 0.20).toFixed(2);
        }

        const timeNow = new Date().toLocaleTimeString('id-ID');
        document.getElementById('signal').innerHTML = `
          ${signalText}<br>
          ⏰ Waktu: ${timeNow}<br>
          💰 Entry: ${last}<br>
          🎯 TP: ${tp}<br>
          🛡️ SL: ${sl}
        `;

      } catch (err) {
        alert('Terjadi kesalahan koneksi API.');
        console.error(err);
      }
    });
  </script>
</body>
</html>
